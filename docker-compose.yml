services:
  # ─── Next.js Application ────────────────────────────────────────────────
  # Nginx on the host reverse-proxies public traffic to this container.
  markdown-app:
    build: .
    container_name: markdown-notetaking-service
    restart: always
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.local
    depends_on:
      - minio

  # ─── MinIO ────────────────────────────────────────────────────────────────
  # Local S3-compatible storage for development.
  # Production: swap env vars to AWS S3 / Cloudflare R2 / etc.
  # Management console at http://localhost:9001 (admin / minioadmin)
  minio:
    image: minio/minio:latest
    container_name: markdown-minio
    restart: always
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
    driver: local
