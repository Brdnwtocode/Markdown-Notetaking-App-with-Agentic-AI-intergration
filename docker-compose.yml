services:
  # ─── Next.js Application ────────────────────────────────────────────────
  markdown-app:
    build: .
    container_name: markdown-notetaking-service
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.local
    depends_on:
      - minio
    # Port 3000 exposed only on localhost — Caddy proxies public traffic
    ports:
      - "127.0.0.1:3000:3000"

  # ─── Caddy Reverse Proxy (Auto-SSL) ─────────────────────────────────────
  # Caddy automatically obtains & renews Let's Encrypt certificates.
  # Update Caddyfile when changing domains.
  caddy:
    image: caddy:2-alpine
    container_name: markdown-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - markdown-app

  # ─── MinIO ────────────────────────────────────────────────────────────────
  # Local S3-compatible storage for development.
  # Production: swap env vars to AWS S3 / Cloudflare R2 / etc.
  # Management console at http://localhost:9001 (admin / minioadmin)
  minio:
    image: minio/minio:latest
    container_name: markdown-minio
    restart: always
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
