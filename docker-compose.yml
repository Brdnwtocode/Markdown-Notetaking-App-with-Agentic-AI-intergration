services:
  # ─── Next.js Application ────────────────────────────────────────────────
  # Nginx on the host reverse-proxies public traffic to this container.
  markdown-app:
    build: .
    container_name: markdown-notetaking-service
    restart: always
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.local
