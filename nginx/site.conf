# Nginx reverse proxy for Next.js (port 3000)
# __DOMAIN__ is replaced by the deploy script with your actual domain.
#
# After first deploy, certbot will modify this file to add SSL settings.
# Do not edit manually on the server — changes will be overwritten on next deploy.

server {
    listen 80;
    server_name __DOMAIN__;

    # Required for NextAuth v5 cookie forwarding
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
