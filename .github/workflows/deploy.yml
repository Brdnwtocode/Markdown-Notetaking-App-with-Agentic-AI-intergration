name: CI/CD Deploy to AWS EC2 (Next.js)

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Next.js to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          source: ".,!node_modules,!.next,!.git,!.github,!.idea,!.junie"
          target: "/home/${{ secrets.SSH_USERNAME }}/markdown-app"
          rm: true

      - name: Run Deploy Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          FASTAPI_URL: ${{ secrets.FASTAPI_URL }}
          AUTH_TRUST_HOST: ${{ secrets.AUTH_TRUST_HOST || 'true' }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          STORAGE_FORCE_PATH_STYLE: ${{ secrets.STORAGE_FORCE_PATH_STYLE || 'false' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          envs: DATABASE_URL,DIRECT_URL,NEXTAUTH_URL,AUTH_SECRET,AUTH_GITHUB_ID,AUTH_GITHUB_SECRET,AUTH_GOOGLE_ID,AUTH_GOOGLE_SECRET,OPENAI_API_KEY,DEEPGRAM_API_KEY,FASTAPI_URL,AUTH_TRUST_HOST,STORAGE_ENDPOINT,STORAGE_REGION,STORAGE_BUCKET,STORAGE_ACCESS_KEY,STORAGE_SECRET_KEY,STORAGE_FORCE_PATH_STYLE
          script: |
            set -e
            cd /home/${{ secrets.SSH_USERNAME }}/markdown-app
            
            # If FASTAPI_URL points to localhost or is empty, rewrite it to host.docker.internal for container networking
            if [ "$FASTAPI_URL" = "http://localhost:8000" ] || [ "$FASTAPI_URL" = "http://127.0.0.1:8000" ] || [ -z "$FASTAPI_URL" ]; then
              FASTAPI_URL="http://host.docker.internal:8000"
            fi
            
            # Generate AUTH_URL from NEXTAUTH_URL for NextAuth v5 compatibility
            if [ -n "$NEXTAUTH_URL" ]; then
              CLEANED_URL="${NEXTAUTH_URL%/}"
              if [[ "$CLEANED_URL" == */api/auth ]]; then
                AUTH_URL="$CLEANED_URL"
              else
                AUTH_URL="${CLEANED_URL}/api/auth"
              fi

              # Extract domain for nginx config
              NGINX_DOMAIN=$(echo "$CLEANED_URL" | sed -E 's|^https?://||' | sed 's|/.*||')
            else
              AUTH_URL=""
              NGINX_DOMAIN="localhost"
            fi

            # Create or update the .env.local file with the environment variables from GitHub Secrets
            cat << EOF > .env.local
            DATABASE_URL="$DATABASE_URL"
            DIRECT_URL="$DIRECT_URL"
            AUTH_SECRET="$AUTH_SECRET"
            AUTH_GITHUB_ID="$AUTH_GITHUB_ID"
            AUTH_GITHUB_SECRET="$AUTH_GITHUB_SECRET"
            AUTH_GOOGLE_ID="$AUTH_GOOGLE_ID"
            AUTH_GOOGLE_SECRET="$AUTH_GOOGLE_SECRET"
            OPENAI_API_KEY="$OPENAI_API_KEY"
            DEEPGRAM_API_KEY="$DEEPGRAM_API_KEY"
            FASTAPI_URL="$FASTAPI_URL"
            AUTH_TRUST_HOST="$AUTH_TRUST_HOST"
            AUTH_URL="$AUTH_URL"
            STORAGE_ENDPOINT="$STORAGE_ENDPOINT"
            STORAGE_REGION="$STORAGE_REGION"
            STORAGE_BUCKET="$STORAGE_BUCKET"
            STORAGE_ACCESS_KEY="$STORAGE_ACCESS_KEY"
            STORAGE_SECRET_KEY="$STORAGE_SECRET_KEY"
            STORAGE_FORCE_PATH_STYLE="$STORAGE_FORCE_PATH_STYLE"
            EOF

            # Check if docker is installed
            if ! command -v docker &> /dev/null; then
              echo "ERROR: docker is not installed on the server. Please run the installation commands."
              exit 1
            fi

            # ── Install & configure nginx with SSL ───────────────────────
            echo "[deploy] Setting up nginx for ${NGINX_DOMAIN}..."

            # Install nginx + certbot if not present
            if ! command -v nginx &> /dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq nginx certbot python3-certbot-nginx
            fi

            # ── Clean up any old configs for this domain ──────────────
            # Remove all existing symlinks and configs that reference this domain
            # to prevent "conflicting server name" errors on reload.
            sudo rm -f "/etc/nginx/sites-enabled/${NGINX_DOMAIN}.conf"
            sudo rm -f "/etc/nginx/sites-available/${NGINX_DOMAIN}.conf"
            sudo rm -f /etc/nginx/sites-enabled/default
            # Clear any certbot configs that might hold the domain from prior runs
            sudo rm -f "/etc/nginx/sites-enabled/${NGINX_DOMAIN}*.conf" 2>/dev/null || true

            # Deploy nginx site config from repo template
            sudo cp nginx/site.conf "/etc/nginx/sites-available/${NGINX_DOMAIN}.conf"
            sudo sed -i "s/__DOMAIN__/${NGINX_DOMAIN}/g" "/etc/nginx/sites-available/${NGINX_DOMAIN}.conf"
            sudo ln -sf "/etc/nginx/sites-available/${NGINX_DOMAIN}.conf" /etc/nginx/sites-enabled/

            # Test config, then start (or restart if already running)
            sudo nginx -t
            if sudo systemctl is-active --quiet nginx; then
              sudo systemctl restart nginx
            else
              sudo systemctl start nginx
            fi

            # Obtain SSL certificate (idempotent — skips if already valid)
            sudo certbot --nginx -d "${NGINX_DOMAIN}" --non-interactive --agree-tos --email "admin@${NGINX_DOMAIN}" --redirect 2>/dev/null || echo "[deploy] Certbot skipped (port 80 must be publicly reachable for ACME challenge)"

            # Run docker compose rebuild and restart
            docker compose down
            docker compose up --build -d

            # Display running containers
            docker compose ps
